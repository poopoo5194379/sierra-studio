name: Secure Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Verify source and tests
        run: npm run check

      - name: Build unsigned test installer in clean runner
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SIERRASTUDIO_UPDATE_REPO: ${{ github.repository }}
        run: npm run pack

      - name: Smoke test packaged application
        shell: powershell
        run: |
          $env:SIERRASTUDIO_E2E_EXECUTABLE = "$pwd\release\win-unpacked\SierraStudio.exe"
          npm run test:e2e

      - name: Generate CycloneDX SBOM
        shell: cmd
        run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application --registry=https://registry.npmjs.org > release\sbom.cdx.json

      - name: Scan artifacts and generate security manifest
        shell: powershell
        run: ./scripts/verify-release-security.ps1 -ReleaseDirectory release

      - name: Attest installer build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release/SierraStudio Setup *.exe

      - name: Upload clean-build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SierraStudio-clean-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/SierraStudio Setup *.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/SIGNING-STATUS.txt
            release/SECURITY-MANIFEST.json
            release/sbom.cdx.json
