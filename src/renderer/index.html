<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SierraStudio</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #111318; }
      .startup-screen {
        box-sizing: border-box; width: 100%; height: 100%; display: grid;
        place-content: center; gap: 14px; color: #e7e9ee;
        font: 500 14px/1.5 system-ui, "Microsoft YaHei", sans-serif;
        letter-spacing: .04em; text-align: center;
      }
      .startup-mark { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
      .startup-bar { width: 220px; height: 3px; overflow: hidden; border-radius: 3px; background: #292d36; }
      .startup-bar::after {
        content: ""; display: block; width: 42%; height: 100%; border-radius: inherit;
        background: #d6b06e; animation: startup-slide 1.15s ease-in-out infinite;
      }
      @keyframes startup-slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-screen" role="status" aria-live="polite">
        <div class="startup-mark">SierraStudio</div>
        <div>正在启动编辑器…</div>
        <div class="startup-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
