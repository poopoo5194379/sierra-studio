<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SierraStudio Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        color: #172033;
        background: #eef2ff;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
      }
      main {
        width: min(900px, calc(100% - 64px));
        margin: 64px auto;
        padding: 56px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 28px 80px #35416a22;
      }
      h1 { margin: 0 0 16px; font-size: 56px; line-height: 1.05; }
      p { max-width: 620px; color: #68708a; font-size: 20px; line-height: 1.7; }
      .badge {
        display: inline-block;
        margin-bottom: 22px;
        padding: 7px 12px;
        border-radius: 999px;
        color: #3157d7;
        background: #e8edff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">LOCAL-FIRST</span>
      <h1>像编辑 PPT 一样调整 HTML</h1>
      <p>点击元素进行选择，双击这段文字开始编辑，也可以修改对齐方式、插入图片并转换为自由定位。</p>
    </main>
  </body>
</html>
