<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Style library fixture</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      color: #1f2937;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .custom-title {
      color: rgb(139, 38, 53);
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 1px;
    }
    .custom-card {
      margin-top: 28px;
      padding: 24px;
      background: rgb(255, 250, 235);
      border: 2px solid rgb(216, 170, 79);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(76, 52, 19, .16);
    }
  </style>
</head>
<body>
  <h1 class="custom-title" data-hs-id="fixture-title">
    自定义报告标题
  </h1>
  <section class="custom-card" data-hs-id="fixture-card">
    <p data-hs-id="fixture-copy">这是一段用于验证样式提取的正文。</p>
  </section>
</body>
</html>
