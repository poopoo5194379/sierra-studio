<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPTX 导出测试</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0b1020; font-family: "IBM Plex Mono", monospace; }
    body { display: grid; gap: 24px; padding: 24px; }
    .scaled-stage { width: 1280px; transform: scale(.75); transform-origin: 0 0; }
    .slide {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      padding: 64px;
      color: #eef2ff;
      background: linear-gradient(135deg, #111a38, #18244c 55%, #392269);
    }
    .slide::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(126, 91, 239, .34);
      filter: blur(20px);
    }
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 80px, rgba(255,255,255,.08) 80px 81px, transparent 81px),
        linear-gradient(0deg, transparent 0 80px, rgba(255,255,255,.08) 80px 81px, transparent 81px);
    }
    h1 { position: relative; z-index: 2; margin: 0; font: 700 64px/1 "Barlow Condensed", sans-serif; }
    p { position: relative; z-index: 2; color: #b7c3e8; font-size: 25px; }
    .cards { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 50px; }
    .card { min-height: 260px; padding: 28px; border: 1px solid rgba(255,255,255,.16); border-radius: 22px; background: rgba(255,255,255,.08); box-shadow: 0 18px 50px rgba(0,0,0,.22); }
    .value { margin-top: 44px; font-size: 48px; font-weight: 700; }
    .light { color: #15203a; background: #f5f7fc; }
    .light p { color: #64708c; }
    .light .card { border-color: #dce2ef; background: white; box-shadow: 0 14px 35px rgba(31,43,77,.08); }
    #pptx-native-chart { width: 100%; height: 190px; margin-top: 12px; }
    .reveal { opacity: 0; transform: translateY(24px); }
    .visible .reveal { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <main class="scaled-stage">
  <section class="slide" data-pptx-slide>
    <h1>智能混合 PowerPoint</h1>
    <p>文本、形状、图片与装饰按照页面层级写入 PPTX。</p>
    <div class="cards">
      <article class="card"><strong>还原度</strong><div class="value">96%</div></article>
      <article class="card"><strong>原生图层</strong><div class="value">24</div></article>
      <article class="card"><strong>导出模式</strong><div class="value">混合</div></article>
    </div>
  </section>
  <section class="slide light" data-pptx-slide>
    <h1>第二页仍然可编辑</h1>
    <p class="reveal">页面容器会被自动识别，每个 DOM 元素保持正确前后顺序。</p>
    <div class="cards reveal">
      <article class="card"><strong>季度销售</strong><div id="pptx-native-chart"></div></article>
      <article class="card"><strong>样式</strong><div class="value">保留</div></article>
      <article class="card"><strong>图层</strong><div class="value">命名</div></article>
    </div>
  </section>
  </main>
  <script>
    const nativeChart = echarts.init(document.getElementById("pptx-native-chart"));
    nativeChart.setOption({
      color: ["#2563eb", "#f97316"],
      grid: { left: 38, right: 12, top: 20, bottom: 28 },
      legend: { show: true, top: 0, textStyle: { color: "#27364b" } },
      xAxis: {
        type: "category",
        data: ["Q1", "Q2", "Q3", "Q4"],
        axisLine: { lineStyle: { color: "#dce3ec" } }
      },
      yAxis: {
        type: "value",
        splitLine: { lineStyle: { color: "#dce3ec" } }
      },
      series: [
        { name: "2025", type: "bar", data: [12, 18, 24, 31] },
        { name: "2026", type: "bar", data: [16, 22, 29, 38] }
      ]
    });
  </script>
</body>
</html>
